name: Android privé — release signée
on:
  workflow_dispatch:
  # Déclenchement ponctuel autorisé par la mise à jour de CE workflow sur main.
  # Les modifications ordinaires du menu ne signent pas automatiquement une APK.
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-private.yml'
permissions:
  contents: read

concurrency:
  group: table-familiale-private-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier les secrets de signature
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TABLE_FAMILIALE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.TABLE_FAMILIALE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.TABLE_FAMILIALE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.TABLE_FAMILIALE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::La clé privée stable de Table Familiale doit être configurée dans les GitHub Actions Secrets."
              exit 1
            fi
          done
          if [ "$RELEASE_KEY_ALIAS" = "androiddebugkey" ]; then
            echo "::error::Une clé Android de débogage ne peut pas signer la release privée."
            exit 1
          fi
      - name: Préparer Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Générer les icônes natives et contrôler le package
        run: |
          node scripts/generate-android-icons.mjs
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
      - name: Configurer versionName et versionCode pour mise à jour Android
        run: node scripts/set-android-version.mjs
      - name: Compiler le package de production non signé
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Signer et vérifier l'APK privé
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TABLE_FAMILIALE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.TABLE_FAMILIALE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.TABLE_FAMILIALE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.TABLE_FAMILIALE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/table-familiale-release.jks" release/app-release-aligned.apk' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/table-familiale-release.jks"
          test -s "$RUNNER_TEMP/table-familiale-release.jks"
          RAW="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$RAW"
          mkdir -p release
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$RAW" release/app-release-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/table-familiale-release.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out release/table-familiale-1.0.8-prive-signe.apk \
            release/app-release-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/table-familiale-officiel.apk
          sha256sum release/table-familiale-officiel.apk > release/SHA256SUMS
          rm -f "$RUNNER_TEMP/table-familiale-release.jks" release/app-release-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: table-familiale-android-officiel
          path: |
            release/table-familiale-officiel.apk
            release/SHA256SUMS
          if-no-files-found: error
