name: APK Android de test
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'model.js'
      - 'pricing.js'
      - 'receipt.js'
      - 'receipt-ocr.js'
      - 'recipes.js'
      - 'meal-plan.js'
      - 'data.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'backup.js'
      - 'pricing.js'
      - 'receipt.js'
      - 'receipt-ocr.js'
      - 'model.js'
      - 'data.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'icons/**'
      - 'sw.js'
      - '.github/workflows/android-debug.yml'
      - '.github/workflows/android-release-private.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Préparer le SDK Android installé sur le runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Générer l'icône native de Table Familiale
        run: |
          node scripts/generate-android-icons.mjs
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
      - name: Estampiller la version Android 1.0.11 et le code croissant
        run: node scripts/set-android-version.mjs
      - name: Compiler l'APK debug
        run: |
          cd android
          chmod +x ./gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "::warning::Gradle/Maven a échoué ; nouvelle résolution des dépendances."
            sleep 12
            ./gradlew assembleDebug --no-daemon --refresh-dependencies
          fi
      - name: Vérifier aussi le package release non signé avant toute signature
        run: |
          set -euo pipefail
          cd android
          if ! ./gradlew assembleRelease --no-daemon; then
            echo "::warning::Nouvelle tentative de compilation release après une erreur Maven."
            sleep 12
            ./gradlew assembleRelease --no-daemon --refresh-dependencies
          fi
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep -F "name='app.tablefamiliale.menus'"
      - name: Auditer la configuration de l'APK de test
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='app.tablefamiliale.menus'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee android-permissions.txt
          if grep -E 'android.permission.(RECORD_AUDIO|ACCESS_FINE_LOCATION|READ_SMS|READ_CONTACTS|QUERY_ALL_PACKAGES)' android-permissions.txt; then
            echo "::error::Autorisation Android non prévue."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: table-familiale-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
