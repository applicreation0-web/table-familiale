name: Importer le code source de Table Familiale
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Télécharger l'archive vérifiée
        run: |
          curl --fail --location --retry 3 --output /tmp/table-familiale.zip 'https://ae66564e-80b7-41e0-87ab-0ab3e969a2df.sandbox.floot.app/_cdn/static/61467550-6149-4b4f-9b03-6280f359025c-table-familiale-source.zip'
          echo '5b2d087f1c78e5c68faf99cada585f68bbb56449fa79fbad941b86e8565b3ffc  /tmp/table-familiale.zip' | sha256sum -c -
          unzip -q -o /tmp/table-familiale.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester et construire
        run: |
          npm test
          npm run build
      - name: Enregistrer l'application sur GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m 'Installer Table Familiale v1 : menus, ingrédients, courses, budget'
            git push origin HEAD:main
          fi
