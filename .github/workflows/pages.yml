name: Tests et build web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check model.js && node --check meal-plan.js
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: table-familiale-web
          path: dist
          if-no-files-found: error
